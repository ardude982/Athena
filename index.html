    <script>
      const gadgetDock = document.querySelector(".NavBar");
      const gadgetPicker = document.querySelector(".gadget-picker");
      const gadgetAddButton = document.querySelector(".gadget-add");
      const gadgetItems = [...document.querySelectorAll(".gadget-item")];
      const gadgetLabels = {
        note: "نوت",
        document: "متن",
        todo: "انجام کار",
        climate: "آب و هوا",
        calculator: "ماشین حساب",
        clock: "ساعت",
        stopwatch: "کرنومتر",
        paint: "نقاشی"
      };
      const hiddenGadgets = new Set(JSON.parse(localStorage.getItem("hidden-gadgets") || "[]"));
      const savedGadgetOrder = JSON.parse(localStorage.getItem("gadget-order") || "[]");

      savedGadgetOrder.forEach((gadgetName) => {
        const item = gadgetItems.find((candidate) => candidate.dataset.gadget === gadgetName);
        if (item) {
          gadgetDock.insertBefore(item, gadgetAddButton);
        }
      });

      function saveHiddenGadgets() {
        localStorage.setItem("hidden-gadgets", JSON.stringify([...hiddenGadgets]));
      }

      function saveGadgetOrder() {
        const order = [...gadgetDock.querySelectorAll(".gadget-item")].map((item) => item.dataset.gadget);
        localStorage.setItem("gadget-order", JSON.stringify(order));
      }

      function renderGadgetPicker(showPicker = false) {
        gadgetPicker.innerHTML = "";
        const removedItems = gadgetItems.filter((item) => hiddenGadgets.has(item.dataset.gadget));

        removedItems.forEach((item) => {
          const restoreButton = document.createElement("button");
          const icon = item.querySelector("i").cloneNode(true);
          restoreButton.type = "button";
          restoreButton.className = "gadget-restore";
          restoreButton.append(icon, document.createTextNode(gadgetLabels[item.dataset.gadget]));
          restoreButton.addEventListener("click", function () {
            hiddenGadgets.delete(item.dataset.gadget);
            item.hidden = false;
            saveHiddenGadgets();
            renderGadgetPicker(true);
          });
          gadgetPicker.appendChild(restoreButton);
        });

        gadgetPicker.hidden = gadgetPicker.childElementCount === 0 || !showPicker;
      }

      function removeGadget(item) {
        hiddenGadgets.add(item.dataset.gadget);
        item.hidden = true;
        saveHiddenGadgets();
        renderGadgetPicker();
      }

      function moveGadget(item, pointerX) {
        const visibleItems = [...gadgetDock.querySelectorAll(".gadget-item:not([hidden])")];
        const target = visibleItems.find((candidate) => {
          if (candidate === item) {
            return false;
          }
          const bounds = candidate.getBoundingClientRect();
          return pointerX < bounds.left + bounds.width / 2;
        });

        if (target) {
          gadgetDock.insertBefore(item, target);
        } else {
          gadgetDock.insertBefore(item, gadgetAddButton);
        }
      }

      gadgetItems.forEach((item) => {
        if (hiddenGadgets.has(item.dataset.gadget)) {
          item.hidden = true;
        }

        let holdTimer;
        let holdTriggered = false;
        let isDragging = false;
        let suppressClick = false;
        let pointerId = null;

        item.addEventListener("pointerdown", function (event) {
          pointerId = event.pointerId;
          holdTriggered = false;
          isDragging = false;
          holdTimer = setTimeout(function () {
            holdTriggered = true;
            item.classList.add("hold-ready");
          }, 550);
        });

        item.addEventListener("pointermove", function (event) {
          if (!holdTriggered || event.pointerId !== pointerId) {
            return;
          }

          if (!isDragging) {
            isDragging = true;
            item.classList.add("is-dragging");
            try {
              item.setPointerCapture(pointerId);
            } catch (error) {
            }
          }

          event.preventDefault();
          moveGadget(item, event.clientX);
        });

        item.addEventListener("pointerup", function () {
          clearTimeout(holdTimer);

          suppressClick = holdTriggered || isDragging;

          if (holdTriggered && !isDragging && window.matchMedia("(max-width: 700px)").matches) {
            removeGadget(item);
          } else if (isDragging) {
            saveGadgetOrder();
          }

          item.classList.remove("hold-ready", "is-dragging");
          holdTriggered = false;
          isDragging = false;
          pointerId = null;
        });

        item.addEventListener("pointercancel", function () {
          clearTimeout(holdTimer);
          item.classList.remove("hold-ready", "is-dragging");
          holdTriggered = false;
          isDragging = false;
          pointerId = null;
        });

        item.addEventListener("click", function (event) {
          if (suppressClick) {
            event.preventDefault();
            event.stopPropagation();
            suppressClick = false;
          }
        }, true);

        item.addEventListener("contextmenu", function (event) {
          event.preventDefault();
          if (!window.matchMedia("(max-width: 700px)").matches) {
            removeGadget(item);
          }
        });
      });

      saveGadgetOrder();

      gadgetAddButton.addEventListener("click", function () {
        const inventoryWasOpen = !gadgetPicker.hidden;
        renderGadgetPicker(!inventoryWasOpen);
        if (gadgetPicker.childElementCount > 0) {
          gadgetPicker.hidden = inventoryWasOpen;
        }
      });

      document.addEventListener("click", function (event) {
        if (!gadgetPicker.contains(event.target) && event.target !== gadgetAddButton && !gadgetAddButton.contains(event.target)) {
          gadgetPicker.hidden = true;
        }
      });

      renderGadgetPicker();
    </script>

        <script>
          const sidebarIconItems = document.querySelectorAll(
            ".note, .longfile, .todo, .climate, .calculatorrrr, .watch, .stopwatch, .PaintApp"
          );

          sidebarIconItems.forEach((item) => {
            const icon = item.querySelector("i");
            let returnTimer;

            item.classList.add("sidebar-icon");

            item.addEventListener("pointerenter", function () {
              if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                return;
              }

              clearTimeout(returnTimer);
              item.classList.remove("is-returning");
              item.classList.add("is-bouncing");
            });

            item.addEventListener("pointerleave", function () {
              item.classList.remove("is-bouncing");
              item.classList.add("is-returning");
              icon.style.transform = "translateY(0)";

              clearTimeout(returnTimer);
              returnTimer = setTimeout(function () {
                item.classList.remove("is-returning");
                icon.style.removeProperty("transform");
              }, 400);
            });
          });
        </script>

<script>
        const time_el = document.querySelector('.watchstop2 .time');
const start_btn = document.getElementById('start');
const stop_btn = document.getElementById("stop");
const reset_btn = document.getElementById("reset");

let seconds = 0;
let interval = null;

// Event listeners
start_btn.addEventListener('click', start);
stop_btn.addEventListener("click", stop);
reset_btn.addEventListener("click", reset);

// Update the timer
function timer () {
	seconds++;

	// Format our time
	let hrs = Math.floor(seconds / 3600);
	let mins = Math.floor((seconds - (hrs * 3600)) / 60);
	let secs = seconds % 60;

	if (secs < 10) secs = '0' + secs;
	if (mins < 10) mins = "0" + mins;
	if (hrs < 10) hrs = "0" + hrs;

	time_el.innerText = `${hrs}:${mins}:${secs}`;
}

function start () {
	if (interval) {
		return
	}

	interval = setInterval(timer, 1000);
}

function stop () {
	clearInterval(interval);
	interval = null;
}

function reset () {
	stop();
	seconds = 0;
	time_el.innerText = '00:00:00';
}
</script>


<script>
    const display = document.querySelector(".display");
const buttons = document.querySelectorAll("button");
const specialChars = ["%", "*", "/", "-", "+", "="];
let output = "";

//Define function to calculate based on button clicked.
const calculate = (btnValue) => {
display.focus();
if (btnValue === "=" && output !== "") {
//If output has '%', replace with '/100' before evaluating.
output = eval(output.replace("%", "/100"));
} else if (btnValue === "AC") {
output = "";
} else if (btnValue === "DEL") {
//If DEL button is clicked, remove the last character from the output.
output = output.toString().slice(0, -1);
} else {
//If output is empty and button is specialChars then return
if (output === "" && specialChars.includes(btnValue)) return;
output += btnValue;
}
display.value = output;
};

//Add event listener to buttons, call calculate() on click.
buttons.forEach((button) => {
//Button click listener calls calculate() with dataset value as argument.
button.addEventListener("click", (e) => calculate(e.target.dataset.value));
});
</script>

<script>
    const wrapper = document.querySelector(".wrapper"),
inputPart = document.querySelector(".input-part"),
infoTxt = inputPart.querySelector(".info-txt"),
inputField = inputPart.querySelector("input"),
locationBtn = inputPart.querySelector("button"),
weatherPart = wrapper.querySelector(".weather-part"),
wIcon = weatherPart.querySelector("img"),
arrowBack = wrapper.querySelector("header i");

let api;

inputField.addEventListener("keyup", e =>{
    if(e.key == "Enter" && inputField.value != ""){
        requestApi(inputField.value);
    }
});

locationBtn.addEventListener("click", () =>{
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(onSuccess, onError);
    }else{
        alert("مرورگر شما این برنامه را پشتیبانی نمیکند");
    }
});

function requestApi(city){
    api = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=2579c0dd658a956e4fbede1fc5da6f0b`;
    fetchData();
}

function onSuccess(position){
    const {latitude, longitude} = position.coords;
    api = `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&units=metric&appid=2579c0dd658a956e4fbede1fc5da6f0b`;
    fetchData();
}

function onError(error){
    infoTxt.innerText = error.message;
    infoTxt.classList.add("ارور");
}

function fetchData(){
    infoTxt.innerText = "...در حال جمع آوری اطلاعات"; 
    infoTxt.classList.add("pending");
    fetch(api).then(res => res.json()).then(result => weatherDetails(result)).catch(() =>{
        infoTxt.innerText = "مشکلی پیش آمد";
        infoTxt.classList.replace("pending", "error");
    });
}

function weatherDetails(info){
    if(info.cod == "404"){
        infoTxt.classList.replace("pending", "error");
        infoTxt.innerText = `${inputField.value} یک شهر محسوب نمیشود`;
    }else{
        const city = info.name;
        const country = info.sys.country;
        const {description, id} = info.weather[0];
        const {temp, feels_like, humidity} = info.main;
        
        if(id == 800){
            img.src = "images/clear.png";
        }else if(id >= 200 && id <= 232){
            wIcon.src = "icons/storm.svg";  
        }else if(id >= 600 && id <= 622){
            wIcon.src = "icons/snow.svg";
        }else if(id >= 701 && id <= 781){
            wIcon.src = "icons/haze.svg";
        }else if(id >= 801 && id <= 804){
            wIcon.src = "icons/cloud.svg";
        }else if((id >= 500 && id <= 531) || (id >= 300 && id <= 321)){
            wIcon.src = "icons/rain.svg";
        }
        
        weatherPart.querySelector(".temp .numb").innerText = Math.floor(temp);
        weatherPart.querySelector(".weather").innerText = description;
        weatherPart.querySelector(".location span").innerText = `${city}, ${country}`;
        weatherPart.querySelector(".temp .numb-2").innerText = Math.floor(feels_like);
        weatherPart.querySelector(".humidity span").innerText = `${humidity}%`;
        infoTxt.classList.remove("pending", "error");
        infoTxt.innerText = "";
        inputField.value = "";
        wrapper.classList.add("active");
    }
}

arrowBack.addEventListener("click", ()=>{
    wrapper.classList.remove("active");
});
</script>

<script>
    const workspacePanels = [
    document.querySelector("#CalBtnhhh"),
    document.querySelector("#todoappdisplaybrrr"),
    document.querySelector("#StopWatchBtn"),
    document.querySelector("#climateappdisplay"),
    document.querySelector("#NoteTab"),
    document.querySelector("#DocumentBtnToggle"),
    document.querySelector("#info")
  ].filter(Boolean);

  function panelStorageKey(panel) {
    return `workspace-panel-${panel.dataset.workspacePanel}`;
  }

  function positionPanel(panel) {
    const stored = JSON.parse(localStorage.getItem(panelStorageKey(panel)) || "null");
    if (!stored) {
      return;
    }

    panel.classList.add("is-positioned");
    panel.style.left = `${stored.left}px`;
    panel.style.top = `${stored.top}px`;
    panel.style.width = `${stored.width}px`;
    panel.style.height = `${stored.height}px`;
    panel.style.transform = "none";
  }

  function savePanel(panel, bounds) {
    localStorage.setItem(panelStorageKey(panel), JSON.stringify({
      left: bounds.left,
      top: bounds.top,
      width: bounds.width,
      height: bounds.height
    }));
  }

    let topZIndex = 100;

  function makePanelMovable(panel, index) {
    panel.dataset.workspacePanel = panel.dataset.workspacePanel || `panel-${index}`;
    positionPanel(panel);

    const resizeHandle = document.createElement("span");
    resizeHandle.className = "workspace-resize-handle";
    resizeHandle.setAttribute("aria-label", "تغییر اندازه ابزار");
    panel.appendChild(resizeHandle);

    let holdTimer;
    let dragState = null;
    let resizeState = null;

    function bringToFront() {
      panel.style.zIndex = ++topZIndex;
    }

        function convertToFixed() {
      const bounds = panel.getBoundingClientRect();
      panel.classList.add("is-positioned");
      
      // Calculate current ratio before setting styles
      const ratio = bounds.width / Math.max(bounds.height, 1);
      
      panel.style.left = `${bounds.left}px`;
      panel.style.top = `${bounds.top}px`;
      panel.style.width = `${bounds.width}px`;
      panel.style.height = `${bounds.height}px`;
      panel.style.transform = "none";
      bringToFront();
      return { bounds, ratio };
    }

    panel.addEventListener("pointerdown", function (event) {
      bringToFront();

      if (event.target.closest("button, input, textarea, select, a, [contenteditable=\"true\"], .workspace-resize-handle")) {
        return;
      }

      clearTimeout(holdTimer);
      holdTimer = setTimeout(function () {
        const { bounds } = convertToFixed();
        dragState = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          left: bounds.left,
          top: bounds.top
        };
        panel.classList.add("is-dragging");
        try {
          panel.setPointerCapture(event.pointerId);
        } catch (error) {
        }
      }, 200);
    });

        panel.addEventListener("pointermove", function (event) {
      if (resizeState && event.pointerId === resizeState.pointerId) {
        event.preventDefault();
        const nextWidth = Math.max(200, resizeState.width + (event.clientX - resizeState.startX));
        const maxWidth = window.innerWidth - panel.getBoundingClientRect().left - 20;
        const width = Math.min(nextWidth, maxWidth);
        const height = width / resizeState.ratio;
        
        panel.style.width = `${width}px`;
        panel.style.height = `${height}px`;
        return;
      }

      if (!dragState || event.pointerId !== dragState.pointerId) {
        return;
      }

      event.preventDefault();
      panel.style.left = `${dragState.left + event.clientX - dragState.startX}px`;
      panel.style.top = `${dragState.top + event.clientY - dragState.startY}px`;
    });

    panel.addEventListener("pointerup", function (event) {
      clearTimeout(holdTimer);
      if (dragState && event.pointerId === dragState.pointerId) {
        savePanel(panel, panel.getBoundingClientRect());
        panel.classList.remove("is-dragging");
        dragState = null;
      }
    });

    panel.addEventListener("pointercancel", function () {
      clearTimeout(holdTimer);
      panel.classList.remove("is-dragging");
      dragState = null;
      resizeState = null;
    });

    resizeHandle.addEventListener("pointerdown", function (event) {
      if (!window.matchMedia("(min-width: 701px)").matches) {
        return;
      }

      event.preventDefault();
      event.stopPropagation();
      const { bounds, ratio } = convertToFixed();
      resizeState = {
        pointerId: event.pointerId,
        startX: event.clientX,
        width: bounds.width,
        height: bounds.height,
        ratio: ratio
      };
      panel.classList.add("is-dragging");
      try {
        panel.setPointerCapture(event.pointerId);
      } catch (error) {
      }
    });


        resizeHandle.addEventListener("pointerup", function () {
          if (resizeState) {
            savePanel(panel, panel.getBoundingClientRect());
          }
          resizeState = null;
          panel.classList.remove("is-dragging");
        });
  }


  workspacePanels.forEach(makePanelMovable);
</script>
